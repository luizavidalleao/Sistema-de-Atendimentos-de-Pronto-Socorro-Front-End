<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pacientes - Vihva</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <script src="assets/js/prototipo/config.js" defer></script>
  <script src="assets/js/prototipo/dados-demo.js" defer></script>
  <script src="assets/js/prototipo/repositorio-demo.js" defer></script>
  <script src="assets/js/comum.js" defer></script>
  <script src="assets/js/pacientes.js" defer></script>
</head>
<body class="pagina-sistema">
  <a class="pular" href="#conteudo">Ir para o conteúdo</a>
  <nav class="nav nav-sistema" aria-label="Navegação principal">
    <a class="logo" href="index.html"><img class="logo-imagem" src="assets/imagens/logo-vihva-fiel.svg" alt="Vihva" width="146" height="46" decoding="async"></a>
    <div class="nav-operacao">
      <button class="btn btn-ghost btn-small menu-toggle" type="button" aria-expanded="false" aria-controls="menu">Menu</button>
      <div class="links" id="menu">
        <a href="painel.html">Painel</a>
        <a href="pacientes.html" class="active" aria-current="page">Pacientes</a>
        <a href="atendimentos.html">Histórico</a>
      </div>
    </div>
  </nav>
  <main id="conteudo" tabindex="-1">
    <div class="page">
      <p id="mensagem" class="alert" role="status" tabindex="-1" hidden></p>
      <noscript>Ative o JavaScript para usar a demonstração do Vihva.</noscript>
      <div class="page-head cabecalho-listagem">
        <h1 id="titulo-pagina">Pacientes</h1>
        <p class="descricao-pagina">Consulte e atualize os dados dos pacientes cadastrados e acesse o histórico de atendimentos.</p>
        <div class="actions">
          <a class="btn btn-receber-paciente" href="novo-atendimento.html"><span class="receber-icone" aria-hidden="true">+</span> Registrar atendimento</a>
        </div>
      </div>
      <div class="card" id="filtros">
        <div class="field">
          <label for="busca">Pesquisar nome, CPF ou cidade</label>
          <input id="busca" name="busca" type="search">
        </div>
      </div>
      <div id="lista">
        <div class="card card-table listagem-responsiva ">
          <table role="table">
            <thead role="rowgroup">
              <tr role="row">
                <th scope="col" role="columnheader">Nome</th>
                <th scope="col" role="columnheader">CPF</th>
                <th scope="col" role="columnheader">Nascimento</th>
                <th scope="col" role="columnheader">Cidade / UF</th>
                <th scope="col" role="columnheader">Ações</th>
              </tr>
            </thead>
            <tbody role="rowgroup">
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>
  <footer class="footer"><span>Juntos pela vida <b aria-hidden="true">♥</b></span></footer>
</body>
</html>
