<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<title>Consulta - Vihva</title>
</head>
<body>

<nav class="nav">
  <a class="logo" href="painel.html"><span class="logo-mark"></span><span>Vihva</span></a>
  <div class="links">
    <a href="painel.html">Painel</a>
    <a href="pacientes.html">Pacientes</a>
    <a href="atendimentos.html" class="active">Atendimentos</a>
    <a href="medicamentos.html">Medicamentos</a>
    <a href="usuarios.html">Usuários</a>
  </div>
  <a class="btn btn-ghost btn-small" href="login.html" onclick="localStorage.clear()">Sair</a>
</nav>

<main>
  <div class="page">
    <div class="page-head">
      <div>
        <h1>Consulta</h1>
        <p class="muted">Maria Aparecida Souza · Atendimento #3</p>
      </div>
    </div>

    <form action="atendimento.html">
      <div class="card">
        <h2>Observações</h2>
        <textarea id="observacoes" placeholder="Evolução, conduta e orientações"></textarea>
      </div>

      <div class="card">
        <h2>Medicamentos prescritos</h2>

        <div id="medicamentos">
          <div class="linha-med">
            <select>
              <option value="">Selecione o medicamento</option>
              <option value="1">Dipirona</option>
              <option value="2">Paracetamol</option>
              <option value="3">Ibuprofeno</option>
              <option value="4">Amoxicilina</option>
            </select>
            <input maxlength="200" placeholder="Posologia (ex.: 1 comprimido a cada 8 horas)">
            <button type="button" class="btn btn-ghost btn-small" onclick="this.parentElement.remove()">Remover</button>
          </div>
        </div>

        <button type="button" class="btn btn-ghost btn-small" onclick="adicionarMedicamento()">+ Adicionar medicamento</button>
      </div>

      <div class="actions">
        <a class="btn btn-ghost" href="atendimento.html">Cancelar</a>
        <button class="btn">Salvar consulta</button>
      </div>
    </form>
  </div>
</main>

<footer class="footer">
  <span>Vihva</span>
  <span>Juntos por mais segurança <b>♥</b></span>
</footer>

<script>
  function adicionarMedicamento() {
    var linha = document.querySelector('.linha-med').cloneNode(true);
    linha.querySelector('input').value = '';
    document.getElementById('medicamentos').appendChild(linha);
  }
</script>

</body>
</html>
