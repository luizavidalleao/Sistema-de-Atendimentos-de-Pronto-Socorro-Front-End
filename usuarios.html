<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<title>Usuários - Vihva</title>
</head>
<body>

<nav class="nav">
  <a class="logo" href="painel.html"><span class="logo-mark"></span><span>Vihva</span></a>
  <div class="links">
    <a href="painel.html">Painel</a>
    <a href="pacientes.html">Pacientes</a>
    <a href="atendimentos.html">Atendimentos</a>
    <a href="medicamentos.html">Medicamentos</a>
    <a href="usuarios.html" class="active">Usuários</a>
  </div>
  <a class="btn btn-ghost btn-small" href="login.html" onclick="localStorage.clear()">Sair</a>
</nav>

<main>
  <div class="page">
    <div class="page-head">
      <h1>Usuários</h1>
      <a class="btn" href="cadastro.html">Novo usuário</a>
    </div>

    <p class="alert erro" id="erro" hidden></p>

    <div class="card card-table">
      <table>
        <tr>
          <th>ID</th>
          <th>Nome</th>
          <th>E-mail</th>
        </tr>
        <tbody id="lista"></tbody>
      </table>
    </div>
  </div>
</main>

<footer class="footer">
  <span>Vihva</span>
  <span>Juntos por mais segurança <b>♥</b></span>
</footer>

<script src="assets/config.js"></script>
<script>
  async function carregar() {
    var erro = document.getElementById('erro');

    try {
      var resposta = await fetch(API + '/api/usuarios', {
        headers: { Authorization: 'Bearer ' + localStorage.getItem('token') }
      });
      var usuarios = await resposta.json();

      if (!resposta.ok) {
        throw new Error(usuarios.mensagem || usuarios.message);
      }

      var lista = document.getElementById('lista');

      for (var i = 0; i < usuarios.length; i++) {
        var linha = document.createElement('tr');
        linha.innerHTML = '<td></td><td></td><td></td>';
        linha.children[0].textContent = usuarios[i].id_usuario;
        linha.children[1].textContent = usuarios[i].nome_completo;
        linha.children[2].textContent = usuarios[i].email;
        lista.appendChild(linha);
      }
    } catch (e) {
      erro.textContent = e.message;
      erro.hidden = false;
    }
  }

  carregar();
</script>

</body>
</html>
